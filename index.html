<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUDE · Papel higiénico húmedo · Chile</title>
  <meta name="description" content="Papel higiénico húmedo, se degrada en el agua. Ya está en Jumbo.">
  <meta name="robots" content="noindex">
  <link rel="preload" as="image" href="/hero-poster.webp" fetchpriority="high">
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="nav-logo" href="#hero" aria-label="NUDE, inicio">
      <img src="/src/assets/img/logo-negro.png" alt="NUDE">
    </a>
    <nav class="nav-links" aria-label="Navegación principal">
      <a href="#como">Cómo se hace</a>
      <a href="#formatos">Formatos</a>
    </nav>
    <a class="btn btn-primario nav-cta" href="#donde">Dónde encontrarlo</a>
  </div>
</header>

<main>
  <section class="hero" id="hero" data-nav="pink">
    <div class="hero-track">
      <div class="hero-sticky">
        <canvas class="hero-canvas" aria-hidden="true"></canvas>
        <img class="hero-poster" src="/hero-poster.webp" alt="Pack de NUDE papel higiénico húmedo sobre fondo rosa">
        <div class="wrap">
          <div class="hero-content">
            <span class="etiqueta rv">1800 · 2026</span>
            <!-- el asterisco después de "abajo" queda sin nota al pie por ahora:
                 pendiente de conversar con Javier en la Fase 3 (ver historial). -->
            <h1 class="h1 rv-split" data-split>Esto (limpiarse ahí abajo *) quedó igual desde 1800.</h1>
            <p class="bajada rv" style="--d:200ms">Papel higiénico húmedo, llegó a Jumbo.</p>
            <p class="firma rv" style="--d:280ms">NUDE. Así se hace.</p>
            <a class="btn btn-primario rv" href="#como" style="--d:360ms">Cómo se hace</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer style="border-top:1px solid var(--linea);padding-block:48px">
  <div class="wrap">
    <p class="etiqueta">NUDE</p>
    <p class="bajada" style="margin-top:8px">Así se hace.</p>
  </div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
